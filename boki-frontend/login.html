<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Boki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #F8FAFC; overflow: hidden; }
        .clay-card {
            background: #ffffff; border-radius: 2rem;
            box-shadow: 8px 8px 16px rgba(166, 180, 200, 0.4), -8px -8px 16px rgba(255, 255, 255, 0.8), inset 2px 2px 4px rgba(255, 255, 255, 0.5), inset -2px -2px 4px rgba(166, 180, 200, 0.1);
        }
        .clay-input {
            background: #F1F5F9; border-radius: 1rem; border: none; outline: none; padding: 1rem 1.5rem; width: 100%;
            box-shadow: inset 4px 4px 8px rgba(166, 180, 200, 0.3), inset -4px -4px 8px rgba(255, 255, 255, 0.9);
            transition: all 0.2s;
        }
        .clay-input:focus { box-shadow: inset 6px 6px 10px rgba(166, 180, 200, 0.4), inset -6px -6px 10px rgba(255, 255, 255, 1); }
        .clay-btn-primary {
            background: #3B82F6; color: white; border-radius: 9999px;
            box-shadow: 6px 6px 12px rgba(59, 130, 246, 0.4), -4px -4px 10px rgba(255, 255, 255, 0.9), inset 2px 2px 6px rgba(255, 255, 255, 0.3), inset -2px -2px 6px rgba(29, 78, 216, 0.5);
            transition: all 0.2s ease; font-weight: 800; width: 100%; padding: 1rem; display: block; text-align: center;
        }
        .clay-btn-primary:active { box-shadow: inset 4px 4px 8px rgba(29, 78, 216, 0.6), inset -4px -4px 8px rgba(255, 255, 255, 0.2); transform: scale(0.96); }
        .floating-bg-shape { position: absolute; filter: blur(80px); z-index: -1; opacity: 0.5; border-radius: 50%; }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4">
    <div class="floating-bg-shape bg-blue-400 w-96 h-96 top-[-100px] left-[-100px]"></div>
    <div class="floating-bg-shape bg-pink-400 w-96 h-96 bottom-[-100px] right-[-100px]"></div>
    
    <div class="clay-card p-10 max-w-md w-full relative z-10 transition-transform duration-300 hover:scale-[1.02]">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center text-4xl font-black text-blue-500 shadow-md mx-auto mb-4">B</div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">Đăng nhập Boki</h1>
            <p class="text-slate-500 font-medium mt-2">Học vui mỗi ngày! 🚀</p>
        </div>
        
        <form action="student-dashboard.html" method="GET" class="space-y-6">
            <div>
                <label class="block text-slate-700 font-bold mb-2 ml-2" for="username">Tên đăng nhập</label>
                <input type="text" id="username" class="clay-input" placeholder="Ví dụ: beminhhoang" required>
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-2 ml-2" for="password">Mật khẩu</label>
                <input type="password" id="password" class="clay-input" placeholder="••••••••" required>
            </div>
            
            <div class="flex items-center justify-between px-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-5 h-5 rounded border-slate-300 text-blue-500 focus:ring-blue-500 cursor-pointer">
                    <span class="text-slate-600 font-medium text-sm">Nhớ mật khẩu</span>
                </label>
                <a href="#" class="text-blue-500 hover:text-blue-700 font-bold text-sm">Quên mật khẩu?</a>
            </div>
            
            <button type="submit" class="clay-btn-primary text-xl">Đăng nhập ngay!</button>
        </form>
        
        <div class="mt-8 text-center text-slate-500 font-medium">
            Chưa có tài khoản? <a href="register.html" class="text-pink-500 hover:text-pink-600 font-bold">Đăng ký mới</a>
        </div>
    </div>
</body>
</html>
