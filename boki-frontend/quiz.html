<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm bài Quiz - Boki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <!-- Header with Timer and Progress -->
    <header class="w-full max-w-4xl mx-auto flex items-center justify-between mb-8">
        <div class="flex items-center gap-3 clay-card px-6 py-3 rounded-full">
            <span class="text-xl font-black text-slate-800 dark:text-slate-100 tracking-tight">Toán Học</span>
            <div class="w-1 h-6 bg-slate-200"></div>
            <span class="font-bold text-slate-500 dark:text-slate-400">Câu 1/5</span>
        </div>

        <div class="flex items-center gap-2 clay-card px-6 py-3 rounded-full text-rose-500">
            <span class="text-xl">⏱️</span>
            <span id="timer" class="text-xl font-black tracking-wider">05:00</span>
        </div>
        
        <a href="lesson-detail.html" class="font-bold text-slate-400 hover:text-slate-600 transition">Thoát ✖</a>
    </header>

    <!-- Progress Bar -->
    <div class="w-full max-w-4xl mx-auto mb-10 h-3 bg-slate-200 rounded-full shadow-inner overflow-hidden">
        <div class="h-full bg-gradient-to-r from-blue-400 to-blue-500 w-1/5 rounded-full shadow-[inset_0_2px_4px_rgba(255,255,255,0.4)] transition-all duration-500"></div>
    </div>

    <!-- Main Question Area -->
    <main class="w-full max-w-4xl mx-auto flex-grow flex flex-col justify-center">
        <!-- Question content -->
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-5xl font-black text-slate-800 dark:text-slate-100 leading-tight mb-6">
                Mẹ mua 5 giỏ cam, mỗi giỏ có 4 quả. Hỏi mẹ mua tất cả bao nhiêu quả cam?
            </h1>
        </div>

        <!-- Options grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12" id="optionsContainer">
            <button class="answer-option flex items-center gap-4 group">
                <span class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center font-black text-slate-400 group-[.selected]:bg-blue-500 group-[.selected]:text-white transition">A</span>
                <span class="text-2xl font-bold text-slate-700 dark:text-slate-200">12 quả cam</span>
            </button>
            <button class="answer-option flex items-center gap-4 group">
                <span class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center font-black text-slate-400 group-[.selected]:bg-blue-500 group-[.selected]:text-white transition">B</span>
                <span class="text-2xl font-bold text-slate-700 dark:text-slate-200">18 quả cam</span>
            </button>
            <button class="answer-option flex items-center gap-4 group">
                <span class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center font-black text-slate-400 group-[.selected]:bg-blue-500 group-[.selected]:text-white transition">C</span>
                <span class="text-2xl font-bold text-slate-700 dark:text-slate-200">20 quả cam</span>
            </button>
            <button class="answer-option flex items-center gap-4 group">
                <span class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center font-black text-slate-400 group-[.selected]:bg-blue-500 group-[.selected]:text-white transition">D</span>
                <span class="text-2xl font-bold text-slate-700 dark:text-slate-200">24 quả cam</span>
            </button>
        </div>

        <!-- Navigation -->
        <div class="flex justify-between items-center mt-auto border-t border-slate-200 dark:border-slate-700 pt-6">
            <button class="font-bold text-slate-400 hover:text-slate-600 transition px-6 py-3">🔙 Câu trước</button>
            <button id="nextBtn" class="clay-btn-primary px-10 py-4 text-xl" disabled>Câu tiếp theo 🚀</button>
        </div>
    </main>

    <!-- Quiz logic (Vanilla JS) -->
    <script>
        // 1. Timer Logic
        let timeLeft = 300; // 5 phút = 300 giây
        const timerEl = document.getElementById('timer');
        
        const updateTimer = () => {
            if (timeLeft <= 0) {
                window.location.href = 'result.html';
                return;
            }
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            timerEl.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            
            // Đỏ dần khi sắp hết giờ
            if (timeLeft < 60) {
                timerEl.parentElement.classList.add('animate-pulse');
            }
        };
        
        setInterval(updateTimer, 1000);

        // 2. Options Selection Logic
        const options = document.querySelectorAll('.answer-option');
        const nextBtn = document.getElementById('nextBtn');

        options.forEach(opt => {
            opt.addEventListener('click', () => {
                // Remove selected class from all
                options.forEach(o => o.classList.remove('selected'));
                // Add to clicked
                opt.classList.add('selected');
                
                // Enable next button
                nextBtn.disabled = false;
            });
        });

        // 3. Navigation (Mock submission on last question)
        nextBtn.addEventListener('click', () => {
            // Because this is a static prototype, we just redirect directly to result.html
            // In a real app, we'd load the next question or submit.
            window.location.href = 'result.html';
        });
    </script>



    <!-- Footer -->
    <footer class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md pt-8 pb-6 border-t border-slate-200 dark:border-slate-700 mt-12 w-full">
        <div class="container mx-auto px-6 flex flex-col items-center text-center">
            <span class="text-xl font-black text-slate-800 dark:text-white tracking-tight mb-2">Boki</span>
            <p class="text-slate-500 dark:text-slate-400 font-medium mb-4 max-w-sm text-sm">Nền tảng học tập vui nhộn, giúp bé phát triển tư duy xuất chúng mỗi ngày.</p>
            <div class="w-full border-t border-slate-100 dark:border-slate-700 pt-4 text-slate-400 dark:text-slate-500 font-bold text-xs mt-2">
                <p>&copy; 2026 Boki Education. Không ngừng sáng tạo.</p>
            </div>
        </div>
    </footer>

    <!-- Floating Dark Mode Toggle -->
    <button id="theme-toggle" class="fixed bottom-6 right-6 z-50 p-3 rounded-full bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700 hover:scale-110 active:scale-95 transition-all cursor-pointer text-slate-600 dark:text-slate-300">
        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>

</body>
</html>
