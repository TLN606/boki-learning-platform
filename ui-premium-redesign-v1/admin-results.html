<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boki Quản trị | Kết quả</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-admin-page="results">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">B</span><span>Boki Quản trị</span></a>
      <button class="btn btn-secondary mobile-menu-btn js-menu-btn" type="button">Menu</button>
      <nav class="nav-links" id="siteNav">
        <a class="nav-link" href="admin-dashboard.html">Bảng điều khiển</a>
        <a class="nav-link" href="admin-students.html">Học sinh</a>
        <a class="nav-link" href="admin-lessons.html">Bài học</a>
        <a class="nav-link active" href="admin-results.html">Kết quả</a>
      </nav>
    </div>
  </header>

  <section class="layout-app">
    <aside class="sidebar pane">
      <p class="badge">Quản trị</p>
      <h3 style="margin-top:0.5rem;font-size:1.8rem;">Trường Tiểu học Boki</h3>
      <nav style="margin-top:1rem;">
        <a href="admin-dashboard.html">Tổng quan <span>01</span></a>
        <a href="admin-students.html">Học sinh <span>02</span></a>
        <a href="admin-lessons.html">Bài học <span>03</span></a>
        <a href="admin-questions.html">Câu hỏi <span>04</span></a>
        <a class="active" href="admin-results.html">Kết quả <span>05</span></a>
      </nav>
    </aside>

    <main>
      <div class="breadcrumb"><a href="index.html">Boki</a> / <a href="admin-dashboard.html">Quản trị</a> / <span>Kết quả</span></div>
      <section class="pane" style="padding:1.2rem;">
        <div class="toolbar">
          <h1 style="font-size:2.4rem;">Kết quả bài quiz</h1>
          <a class="btn btn-secondary" data-demo-submit="Đã xuất báo cáo PDF (prototype)" href="#">Xuất báo cáo</a>
        </div>
        <div class="toolbar" style="margin-top:0.9rem;">
          <input id="adminSearch" class="field" placeholder="Tìm theo học sinh, bài học..." style="max-width:360px;">
          <select id="adminStatus" style="width:220px;">
            <option value="">Tất cả</option>
            <option value="2026-04-08">Ngày 08/04</option>
            <option value="2026-04-07">Ngày 07/04</option>
          </select>
        </div>

        <div class="table-wrap" style="margin-top:1rem;">
          <table class="table">
            <thead>
              <tr>
                <th data-sort="id">Mã ket qua</th>
                <th data-sort="student">Học sinh</th>
                <th data-sort="lesson">Bài học</th>
                <th data-sort="score">Diem</th>
                <th data-sort="correct">Câu đúng</th>
                <th data-sort="date">Ngày nop</th>
              </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
        <div id="adminPager" class="pager"></div>
      </section>
    </main>
  </section>

  <div id="toastStack" class="toast-stack"></div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
