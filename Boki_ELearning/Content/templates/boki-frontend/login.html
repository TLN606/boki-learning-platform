<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Boki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col min-h-screen relative p-4 sm:p-8">
    <!-- Background Ornaments -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
        <div class="floating-bg-shape bg-blue-400 dark:bg-blue-600 w-96 h-96 top-[-100px] left-[-100px]"></div>
        <div class="floating-bg-shape bg-pink-400 dark:bg-pink-600 w-96 h-96 bottom-[-100px] right-[-100px]"></div>
    </div>

    
    
    
    

    
</div><!-- Top Navigation Tools -->
    <div class="fixed top-4 left-4 right-4 z-50 flex justify-between pointer-events-none">
        <a href="landing.html" class="pointer-events-auto flex items-center gap-2 p-2 px-4 rounded-full bg-white/70 dark:bg-slate-800/70 backdrop-blur-md shadow-sm border border-white/50 dark:border-slate-700/50 text-slate-600 dark:text-slate-300 hover:text-brand-500 dark:hover:text-brand-400 font-bold transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Trang chủ
        </a>
        <button id="theme-toggle" class="pointer-events-auto p-2 rounded-full bg-white/70 dark:bg-slate-800/70 backdrop-blur-md shadow-sm border border-white/50 dark:border-slate-700/50 hover:bg-white dark:hover:bg-slate-700 transition cursor-pointer text-slate-600 dark:text-slate-300">
            <!-- Sun icon -->
            <svg id="theme-toggle-light-icon" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <!-- Moon icon -->
            <svg id="theme-toggle-dark-icon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
    </div>

    <!-- Login Form -->
    <div class="flex-grow flex items-center justify-center my-12 relative z-10 w-full">
        <div class="clay-card bg-white dark:bg-slate-800 p-8 sm:p-12 max-w-md w-full transition-transform duration-300 hover:scale-[1.01] flex flex-col items-center">
            
            <!-- Logo area -->
            <div class="w-20 h-20 bg-brand-500 rounded-3xl flex items-center justify-center text-white shadow-lg shadow-brand-500/30 mb-6 rotate-3 hover:rotate-0 transition-transform cursor-pointer">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            
            <h1 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight mb-2 text-center">Chào mừng <br/>trở lại Boki!</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium mb-10 text-center flex items-center justify-center gap-2">
                Học vui mỗi ngày
                <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </p>
            
            <form action="student-dashboard.html" method="GET" class="space-y-6 w-full">
                <!-- Username Input -->
                <div class="relative">
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-2 ml-2 text-sm" for="username">Tên đăng nhập</label>
                    <div class="relative">
                        <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <input type="text" id="username" class="clay-input" placeholder="Ví dụ: beminhhoang" required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="relative">
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-2 ml-2 text-sm" for="password">Mật khẩu</label>
                    <div class="relative">
                        <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <input type="password" id="password" class="clay-input" placeholder="••••••••" required>
                    </div>
                </div>
                
                <div class="flex items-center justify-between px-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" class="peer appearance-none w-5 h-5 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 checked:bg-brand-500 checked:border-brand-500 cursor-pointer transition">
                            <svg class="w-3 h-3 text-white absolute opacity-0 peer-checked:opacity-100 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <span class="text-slate-600 dark:text-slate-400 font-medium text-sm group-hover:text-slate-800 dark:group-hover:text-slate-200 transition">Nhớ mật khẩu</span>
                    </label>
                    <a href="#" class="text-brand-500 hover:text-brand-600 dark:hover:text-brand-400 font-bold text-sm transition">Quên mật khẩu?</a>
                </div>
                
                <button type="submit" class="clay-btn-primary text-xl mt-4 w-full py-4 flex items-center justify-center gap-2">
                    Đăng nhập
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
            
            <div class="mt-8 text-center text-slate-500 dark:text-slate-400 font-medium text-sm w-full border-t border-slate-100 dark:border-slate-700 pt-6">
                Chưa có tài khoản? <a href="register.html" class="text-pink-500 hover:text-pink-600 dark:text-pink-400 dark:hover:text-pink-300 font-bold transition">Đăng ký mới ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
