<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boki | Quiz bai hoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">B</span><span>Boki Student</span></a>
      <button class="btn btn-secondary mobile-menu-btn js-menu-btn" type="button">Menu</button>
      <nav class="nav-links" id="siteNav">
        <a class="nav-link" href="student-dashboard.html">Dashboard</a>
        <a class="nav-link" href="student-lessons.html">Kho bai hoc</a>
        <a class="nav-link active" href="student-quiz.html">Quiz</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="breadcrumb"><a href="index.html">Boki</a> / <a href="student-lessons.html">Danh sach bai hoc</a> / <span>Quiz</span></div>
    <section id="quizApp" class="quiz-layout">
      <article class="pane question-box">
        <div class="toolbar">
          <div>
            <p class="badge">Quiz bai 202</p>
            <h1 style="font-size:2.3rem;margin-top:0.5rem;">So sanh phan so co ban</h1>
          </div>
          <div class="badge warn">Con lai: <strong id="quizTimer" style="margin-left:0.35rem;">15:00</strong></div>
        </div>
        <p style="margin-top:1rem;color:var(--text-muted);">Cau <strong id="quizCurrent">1/6</strong></p>
        <h2 id="quizQuestion" style="margin-top:0.6rem;font-size:1.95rem;">Dang tai cau hoi...</h2>
        <div id="quizOptions" class="option-list"></div>
        <div class="toolbar" style="margin-top:1.1rem;">
          <button id="quizPrev" class="btn btn-secondary" type="button">Cau truoc</button>
          <div class="toolbar">
            <button id="quizNext" class="btn btn-secondary" type="button">Cau tiep</button>
            <button id="quizSubmit" class="btn btn-primary" type="button">Nop bai</button>
          </div>
        </div>
      </article>

      <aside class="pane quiz-map">
        <h3 style="font-size:1.5rem;">Ban do cau hoi</h3>
        <p style="color:var(--text-muted);margin-top:0.3rem;">Nhan de di chuyen nhanh giua cac cau.</p>
        <div id="quizMap" class="quiz-grid"></div>
        <a href="student-lesson-detail.html" class="btn btn-ghost" style="margin-top:1rem;">Quay lai bai hoc</a>
      </aside>
    </section>
  </main>

  <div id="toastStack" class="toast-stack"></div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/quiz.js"></script>
</body>
</html>
