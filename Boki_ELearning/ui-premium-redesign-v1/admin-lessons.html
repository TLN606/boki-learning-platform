<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boki Admin | Bai hoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-admin-page="lessons">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">B</span><span>Boki Admin</span></a>
      <button class="btn btn-secondary mobile-menu-btn js-menu-btn" type="button">Menu</button>
      <nav class="nav-links" id="siteNav">
        <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
        <a class="nav-link" href="admin-students.html">Hoc sinh</a>
        <a class="nav-link active" href="admin-lessons.html">Bai hoc</a>
        <a class="nav-link" href="admin-results.html">Ket qua</a>
      </nav>
    </div>
  </header>

  <section class="layout-app">
    <aside class="sidebar pane">
      <p class="badge">Quan tri</p>
      <h3 style="margin-top:0.5rem;font-size:1.8rem;">Truong Tieu hoc Boki</h3>
      <nav style="margin-top:1rem;">
        <a href="admin-dashboard.html">Tong quan <span>01</span></a>
        <a href="admin-students.html">Hoc sinh <span>02</span></a>
        <a class="active" href="admin-lessons.html">Bai hoc <span>03</span></a>
        <a href="admin-questions.html">Cau hoi <span>04</span></a>
        <a href="admin-results.html">Ket qua <span>05</span></a>
      </nav>
    </aside>

    <main>
      <div class="breadcrumb"><a href="index.html">Boki</a> / <a href="admin-dashboard.html">Quan tri</a> / <span>Bai hoc</span></div>
      <section class="pane" style="padding:1.2rem;">
        <div class="toolbar">
          <h1 style="font-size:2.4rem;">Quan ly bai hoc</h1>
          <a class="btn btn-primary" data-demo-submit="Da tao bai hoc nhap moi (prototype)" href="#">Them bai hoc</a>
        </div>
        <div class="toolbar" style="margin-top:0.9rem;">
          <input id="adminSearch" class="field" placeholder="Tim theo mon hoc, ten bai..." style="max-width:360px;">
          <select id="adminStatus" style="width:220px;">
            <option value="">Tat ca trang thai</option>
            <option value="hoan thanh">Hoan thanh</option>
            <option value="dang hoc">Dang hoc</option>
            <option value="chua hoc">Chua hoc</option>
          </select>
        </div>

        <div class="table-wrap" style="margin-top:1rem;">
          <table class="table">
            <thead>
              <tr>
                <th data-sort="id">Ma</th>
                <th data-sort="subject">Mon</th>
                <th data-sort="title">Ten bai hoc</th>
                <th data-sort="teacher">Giao vien</th>
                <th data-sort="progress">Tien do TB</th>
                <th data-sort="status">Trang thai</th>
              </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
        <div id="adminPager" class="pager"></div>
      </section>
    </main>
  </section>

  <div id="toastStack" class="toast-stack"></div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
